plugins { id 'com.android.application' }

android { namespace 'com.m0g.face', compileSdk 34
    defaultConfig { applicationId 'com.m0g.face'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0.0' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
